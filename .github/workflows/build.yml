name: Build CR6608 OpenWrt Firmware

# 手动触发：进入 Actions 标签 → 选择本工作流 → Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd openssl curl ca-certificates coreutils findutils tar

      - name: 赋予脚本执行权限
        run: chmod +x build.sh

      - name: 构建固件
        run: bash build.sh

      - name: 列出产物
        run: ls -lh output/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: CR6608-OpenWrt-firmware
          path: |
            output/*.bin
            output/*.txt
          if-no-files-found: error
          retention-days: 30
